spring.application.name=cognitive_health_management

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/cognitive_health?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis.type-aliases-package=com.example.work_program.modules
mybatis.configuration.map-underscore-to-camel-case=true
# 日志配置（使用 logback-spring.xml，不在此处打印 SQL）
logging.level.root=INFO
logging.level.com.example.work_program=INFO
logging.level.com.example.work_program.controller=DEBUG
logging.level.com.example.work_program.service=DEBUG
logging.level.com.example.work_program.mapper=DEBUG
logging.level.org.mybatis=WARN
logging.level.org.apache.ibatis=WARN
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN

# JWT配置
jwt.secret=your-256-bit-secret-key-for-jwt-token-signing-cognitive-health-system
jwt.expiration=86400000

# 服务器配置
server.port=8080
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never
